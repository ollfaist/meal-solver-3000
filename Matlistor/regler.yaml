# Meal Solver 3000 — Rules
# Controls how the week's dinners are selected

max_per_week:
  köttfärs: 2
  fisk: 1

min_per_week:
  vegetarisk: 1

# These tags may not appear on adjacent days
no_consecutive:
  - potatis
  - ris
  - pasta
  - nudlar

# The same dish cannot appear again within X days
repeat_interval_days: 14

# Maximum number of attempts before the solver gives up and reports a conflict
max_attempts: 1000
