generate_week:
  name: Generate week's dinners
  description: Randomizes the week's dinners taking into account locked days and rules.

add_dish:
  name: Add dish
  description: Adds a new dish to the dish list.
  fields:
    name:
      description: Name of the dish
      example: "Salmon with potatoes"
    days:
      description: "vardag, helg or båda"
      example: "vardag"
    tags:
      description: List of tags
      example: ["fisk", "potatis"]
    locked_day:
      description: Weekday the dish is always served, in Swedish (optional)
      example: "fredag"
    requires:
      description: Another dish that must be in the same week (optional)
      example: "Spagetti & Köttfärssås"

update_dish:
  name: Update dish
  description: Updates an existing dish in the dish list.
  fields:
    old_name:
      description: Current name of the dish
      example: "Salmon with potatoes"
    name:
      description: New name (same if no rename)
      example: "Salmon with rice"
    days:
      description: "vardag, helg or båda"
      example: "helg"
    tags:
      description: List of tags
      example: ["fisk", "ris"]
    locked_day:
      description: Weekday the dish is always served, in Swedish (optional)
      example: ""
    requires:
      description: Another dish that must be in the same week (optional)
      example: ""

remove_dish:
  name: Remove dish
  description: Removes a dish from the dish list.
  fields:
    name:
      description: Name of the dish
      example: "Salmon with potatoes"

create_tag:
  name: Create tag
  description: Adds a new tag to the registry. Stored lower-case.
  fields:
    name:
      description: Name of the tag
      example: "fisk"

rename_tag:
  name: Rename tag
  description: Renames a tag in the registry and in every dish using it.
  fields:
    old_name:
      description: Current name of the tag
      example: "fisk"
    new_name:
      description: New name of the tag
      example: "skaldjur"

remove_tag:
  name: Remove tag
  description: Removes a tag from the registry and from every dish using it.
  fields:
    name:
      description: Name of the tag
      example: "fisk"
